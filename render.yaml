version: "1"
projects:
- name: KodaNorth's Project
  environments:
  - name: Production
    services:
      - type: web
        name: canadaprintstudio-api
        runtime: node
        rootDir: backend
        plan: free
        buildCommand: npm ci && npm run build
        startCommand: npm start
        healthCheckPath: /api/health
        autoDeployTrigger: commit
        envVars:
          - key: NODE_VERSION
            value: "22"
          - key: MONGODB_URI
            sync: false
          - key: FRONTEND_URL
            sync: false
          - key: SUPABASE_URL
            sync: false
          - key: SUPABASE_SERVICE_ROLE_KEY
            sync: false
          - key: SUPABASE_GALLERY_BUCKET
            value: gallery

      - type: web
        name: canadaprintstudio-admin
        runtime: static
        plan: free
        buildCommand: npm ci && npm run build
        staticPublishPath: ./dist
        autoDeployTrigger: commit
        routes:
          - type: rewrite
            source: /*
            destination: /index.html
        envVars:
          - key: NODE_VERSION
            value: "22"
          - key: VITE_API_URL
            sync: false
          - key: VITE_SUPABASE_URL
            sync: false
          - key: VITE_SUPABASE_ANON_KEY
            sync: false
          - key: VITE_SUPABASE_GALLERY_BUCKET
            value: gallery
