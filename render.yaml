version: "1"
projects:
- name: PrintConfig
  environments:
  - name: Production
    services:
      - type: web
        name: printconfig-api
        runtime: node
        plan: free
        buildCommand: npm ci && npm --prefix frontend ci && npm run build
        startCommand: npm start
        healthCheckPath: /api/health
        autoDeployTrigger: commit
        envVars:
          - key: NODE_VERSION
            value: "22"
          - key: MONGODB_URI
            sync: false
          - key: FRONTEND_URL
            sync: false
          - key: JWT_SECRET
            generateValue: true
          - key: CLOUDFLARE_ACCOUNT_ID
            sync: false
          - key: CLOUDFLARE_R2_ACCESS_KEY_ID
            sync: false
          - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
            sync: false
          - key: CLOUDFLARE_PUBLIC_DEV_URL
            sync: false
          - key: CLOUDFLARE_R2_BUCKET
            value: printconfig
