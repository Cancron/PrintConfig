version: "1"
projects:
- name: PrintConfig
  environments:
  - name: Production
    services:
      - type: web
        name: printconfig-api
        runtime: node
        rootDir: backend
        plan: free
        buildCommand: npm ci && npm run build
        startCommand: npm start
        healthCheckPath: /api/health
        autoDeployTrigger: commit
        envVars:
          - key: NODE_VERSION
            value: "22"
          - key: MONGODB_URI
            sync: false
          - key: FRONTEND_URL
            sync: false
          - key: JWT_SECRET
            generateValue: true
          - key: SUPABASE_URL
            sync: false
          - key: SUPABASE_SERVICE_ROLE_KEY
            sync: false
          - key: SUPABASE_GALLERY_BUCKET
            value: gallery
          - key: CLOUDFLARE_ACCOUNT_ID
            sync: false
          - key: CLOUDFLARE_R2_ACCESS_KEY_ID
            sync: false
          - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
            sync: false
          - key: CLOUDFLARE_PUBLIC_DEV_URL
            sync: false
          - key: CLOUDFLARE_R2_BUCKET
            value: printconfig

      - type: web
        name: printconfig-admin
        runtime: static
        plan: free
        buildCommand: npm ci && npm run build
        staticPublishPath: ./dist
        autoDeployTrigger: commit
        routes:
          - type: rewrite
            source: /*
            destination: /index.html
        envVars:
          - key: NODE_VERSION
            value: "22"
          - key: VITE_API_URL
            sync: false
